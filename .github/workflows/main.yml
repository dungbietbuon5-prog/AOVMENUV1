name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies & Theos
      run: |
        brew install ldid
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        sudo $THEOS/bin/nic.pl <<< "13" || true

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        make clean
        # Lệnh này chỉ build ra file .dylib, không đóng gói .deb
        make

    - name: Upload Dylib
      uses: actions/upload-artifact@v4
      with:
        name: TrungDungAOV-Dylib
        # Đường dẫn lấy file .dylib vừa build xong
        path: .theos/obj/debug/TrungDungAOV.dylib
