name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        sudo $THEOS/bin/nic.pl <<< "13" || true

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        make clean
        make package FINALPACKAGE=1

    - name: Upload Dylib and Deb
      uses: actions/upload-artifact@v4
      with:
        name: TrungDung-AOV-Dylib
        path: |
          .theos/obj/debug/*.dylib
          packages/*.deb
